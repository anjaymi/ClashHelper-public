name: 合并订阅

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clash-subscriptions
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: 安装依赖并验证合并功能
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: 读取订阅配置
        id: config
        env:
          SUBSCRIPTIONS: ${{ secrets.SUBSCRIPTIONS }}
          SITES_YAML: ${{ secrets.SITES_YAML }}
        run: python scripts/prepare_sites.py

      - name: 校验订阅发布权限
        if: steps.config.outputs.configured == 'true'
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/publish_gist.py --check

      - name: 抓取、过滤并合并
        id: merge
        if: steps.config.outputs.configured == 'true'
        run: python helper.py template.yaml out.yaml

      - name: 使用 Mihomo 内核校验完整配置
        id: core_validation
        if: steps.config.outputs.configured == 'true' && steps.merge.outcome == 'success'
        run: python scripts/validate_mihomo.py out.yaml

      - name: 更新固定订阅地址
        if: steps.config.outputs.configured == 'true' && steps.merge.outcome == 'success' && steps.core_validation.outcome == 'success'
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/publish_gist.py out.yaml

      - name: 保存失败原因供管理页查看
        if: always() && (steps.merge.outcome == 'failure' || steps.core_validation.outcome == 'failure') && hashFiles('merge-status.json') != ''
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/publish_gist.py --status merge-status.json
