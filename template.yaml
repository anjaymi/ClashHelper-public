# 订阅只提供节点；分流规则统一使用本模板。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
profile:
  store-selected: true

dns:
  enable: true
  ipv6: false
  # Keep real destination hostnames for rule matching; do not synthesize Fake-IP.
  enhanced-mode: redir-host
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # When Mihomo resolves these hostnames locally, send DNS through their group.
  # proxy-server-nameserver above bootstraps the proxy node hostnames first.
  nameserver-policy:
    # Query both providers through the same OpenAI exit; first success wins.
    '+.openai.com': &openai-dns
      - 'https://1.1.1.1/dns-query#OpenAI-Sub4'
      - 'https://8.8.8.8/dns-query#OpenAI-Sub4'
    '+.chatgpt.com': *openai-dns
    '+.oaistatic.com': *openai-dns
    '+.oaiusercontent.com': *openai-dns
    '+.oaistatsig.com': *openai-dns
    '+.openaimerge.com': *openai-dns
    '+.sora.com': *openai-dns
    '+.chatgpt.livekit.cloud': *openai-dns
    'challenges.cloudflare.com': *openai-dns
    'cdn.workos.com': *openai-dns
    'forwarder.workos.com': *openai-dns
    'frontend-apps-multi-region.workos.com': *openai-dns
    'images.workoscdn.com': *openai-dns
    'setup.workos.com': *openai-dns
    'workos.imgix.net': *openai-dns
    '+.anthropic.com': 'https://unfiltered.adguard-dns.com/dns-query#ChatGPT'
    '+.claude.ai': 'https://unfiltered.adguard-dns.com/dns-query#ChatGPT'
    '+.gemini.google.com': 'https://unfiltered.adguard-dns.com/dns-query#Gemini'
    '+.generativelanguage.googleapis.com': 'https://unfiltered.adguard-dns.com/dns-query#Gemini'
    '+.aistudio.google.com': 'https://unfiltered.adguard-dns.com/dns-query#Gemini'
  nameserver:
    # Parallel defaults, not ordered fallback or geographic DNS scheduling.
    - https://unfiltered.adguard-dns.com/dns-query
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxies: []

proxy-groups:
  - name: PROXY
    type: select
    proxies: [AUTO]
  - name: OpenAI-Sub4
    type: select
    proxies: [REJECT]
    # Mihomo sends HEAD probes; use the same 204 baseline as other groups.
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 0
  - name: ChatGPT
    type: select
    proxies: [AUTO]
  - name: AgentRouter
    type: select
    proxies: [DIRECT]
  # Stable defaults follow OpenAI; each service can also select any merged node.
  - name: Kiro
    type: select
    proxies: [OpenAI-Sub4]
  - name: AI-Coding
    type: select
    proxies: [OpenAI-Sub4]
  - name: AI-Services
    type: select
    proxies: [OpenAI-Sub4]
  - name: Arena
    type: select
    proxies: [AUTO]
  - name: Mirasim
    type: select
    proxies: [AUTO]
  - name: US-Sub4
    type: url-test
    proxies: [REJECT]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: Gemini
    type: select
    proxies: [Google-All]
  - name: Google
    type: select
    proxies: [Google-All]
  - name: Google-All
    type: select
    proxies: [AUTO]
  - name: GitHub
    type: url-test
    proxies: [AUTO]
    # Probe the service users actually need instead of a generic 204 URL.
    url: https://github.com/
    expected-status: 200
    interval: 300
    tolerance: 100
  - name: Docker
    type: select
    proxies: [AUTO]
  - name: Microsoft
    type: select
    proxies: [AUTO]
  - name: OneDrive
    type: select
    proxies: [AUTO]
  - name: Telegram
    type: select
    proxies: [AUTO]
  - name: Discord
    type: select
    proxies: [AUTO]
  - name: Social
    type: select
    proxies: [AUTO]
  - name: Media
    type: select
    proxies: [AUTO]
  - name: Games
    type: select
    proxies: [AUTO]
  - name: AUTO
    type: url-test
    proxies: []
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: Final
    type: select
    proxies: [PROXY, DIRECT]

rule-providers:
  reject:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/reject.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: ./ruleset/direct.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    path: ./ruleset/proxy.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./ruleset/lancidr.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
    path: ./ruleset/cncidr.yaml
    interval: 86400

